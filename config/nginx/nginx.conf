worker_processes auto;
events { worker_connections 1024; }

http {
    # DNS interno do Docker: resolve os upstreams em runtime (não na subida),
    # então o gateway não cai quando um backend está fora do ar.
    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 8080;

        add_header X-Correlation-ID $request_id always;

        # Health check do gateway
        location = /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        # ── Liveness/Readiness por serviço (via gateway) ───────────────
        location ~ ^/health/(catalog|cart|order|payment|api-rest)/(live|ready)$ {
            set $backend $1;
            proxy_pass http://$backend:5000/health/$2;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        # ── Aula (storytelling) ─────────────────────────────────────────
        location = /aula {
            return 301 /aula/;
        }

        location /aula/ {
            alias /usr/share/nginx/html/aula/;
            index index.html;
            add_header X-Correlation-ID $request_id always;
        }

        # ── Documentação combinada (ReDoc + Swagger UI) ───────────────
        location = /redoc {
            return 302 /docs/;
        }

        location = /docs/swagger {
            return 302 /docs/swagger.html;
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
            add_header X-Correlation-ID $request_id always;
        }

        # ── API pública versionada ─────────────────────────────────────────
        location ~ ^/api/v1/catalogo/(.*)$ {
            set $backend catalog;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:5000/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location ~ ^/api/v1/carrinho/(.*)$ {
            set $backend cart;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:5000/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location ~ ^/api/v1/pedidos/(.*)$ {
            set $backend order;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:5000/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location ~ ^/api/v1/pagamentos/(.*)$ {
            set $backend payment;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:5000/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location ~ ^/api/v1/mensagens/(.*)$ {
            set $backend api-rest;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:5000/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
        }

        # Fallback
        location / {
            return 404 '{"error":"not found"}';
            add_header Content-Type application/json;
        }
    }
}