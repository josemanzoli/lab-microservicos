apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: traceId
          - key: correlationId
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="dockerlogs", is_app="true"} | json | traceId="$${__trace.traceId}" or correlationId="$${__span.tags["messaging.correlation_id"]}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/wal
        remote_write:
          - url: http://prometheus:9090/api/v1/write