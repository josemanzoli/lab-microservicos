name: lab-microservicos

x-logging: &loki-logging
  driver: json-file
  options:
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-app-env: &app-env
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passw123}
  POSTGRES_HOST: postgres
  TEMPO_ENDPOINT: ${TEMPO_ENDPOINT:-http://tempo:4317}
  ENV: ${ENV:-development}
  HTTP_CALL_LATENCY_MS: ${HTTP_CALL_LATENCY_MS:-20}
  SERVICE_PROCESSING_LATENCY_MS: ${SERVICE_PROCESSING_LATENCY_MS:-10}
  CONSUME_DELAY_MS: ${CONSUME_DELAY_MS:-10}

x-app-defaults: &app-defaults
  restart: on-failure
  logging: *loki-logging

services:
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/mnt/config/loki-config.yaml
    command: -config.file=/mnt/config/loki-config.yaml
    logging: *loki-logging

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./config/loki/promtail-config.yaml:/mnt/config/promtail-config.yaml
      - /var/lib/docker/containers:/host/containers
    command: -config.file /mnt/config/promtail-config.yaml
    logging: *loki-logging

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-testloki}
    logging: *loki-logging

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    logging: *loki-logging

  tempo:
    image: grafana/tempo:2.4.1
    command: -config.file=/etc/tempo.yml
    ports:
      - "3200:3200" # HTTP API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    logging: *loki-logging

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "54323:54323"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passw123}
      POSTGRES_DB: ${POSTGRES_DB:-messages_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-messages_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *loki-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    logging: *loki-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
      - 5672:5672
      - 15672:15672
      - 15692:15692 # Prometheus metrics port
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-passw123}

  api-rest:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: ${POSTGRES_DB:-messages_db}

  consumer:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    command: [ "python", "consumer.py" ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: ${POSTGRES_DB:-messages_db}

  task-consumer:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/messaging-demo/Dockerfile
    command: [ "python", "task_consumer.py" ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: ${POSTGRES_DB:-messages_db}

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs/openapi:/usr/share/nginx/html/docs:ro
      - ./docs/aula:/usr/share/nginx/html/aula:ro
    depends_on:
      - catalog
      - cart
      - order
      - payment
      - api-rest
    logging: *loki-logging

  catalog:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: catalog_db

  payment:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: payment_db
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.2}
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-0}

  cart:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    environment:
      <<: *app-env
      POSTGRES_DB: cart_db
      CATALOG_URL: http://catalog:5000

  order:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/order/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cart:
        condition: service_started
      payment:
        condition: service_started
      catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: order_db
      CART_URL: http://cart:5000
      PAYMENT_URL: http://payment:5000
      CATALOG_URL: http://catalog:5000
      RABBITMQ_HOST: rabbitmq

  invoice-worker:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/invoice/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: invoice_db
      RABBITMQ_HOST: rabbitmq
      INVOICE_FAIL_RATE: ${INVOICE_FAIL_RATE:-0.0}
      CONSUME_DELAY_MS: ${CONSUME_DELAY_MS:-10}

  logistics-worker:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/logistics/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      POSTGRES_DB: logistics_db
      RABBITMQ_HOST: rabbitmq
      CONSUME_DELAY_MS: ${LOGISTICS_CONSUME_DELAY_MS:-20}

  warranty-worker:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/warranty/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    environment:
      <<: *app-env
      POSTGRES_DB: warranty_db
      RABBITMQ_HOST: rabbitmq
      CATALOG_URL: http://catalog:5000
      CONSUME_DELAY_MS: ${WARRANTY_CONSUME_DELAY_MS:-30}

volumes:
  grafana-data:
  tempo-data:
  postgres-data:
  rabbitmq-data:
  rabbitmq-log:
